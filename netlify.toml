[build]
  publish = "dist/mobile"
  command = "npm run build"
  functions = "netlify/functions"

[functions.environment]
  PETPOOJA_ENABLED = "false"
  PETPOOJA_APP_KEY = ""
  PETPOOJA_APP_SECRET = ""
  PETPOOJA_ACCESS_TOKEN = ""
  PETPOOJA_REST_ID = ""
  PORTER_API_KEY = ""
  PORTER_CUSTOMER_ID = ""
  PORTER_CITY = "Ahmedabad"
  PORTER_WEBHOOK_SECRET = ""
  FCM_ENABLED = "false"
  VITE_FCM_VAPID_KEY = ""

# Scheduled Nightly Reconciliation:
# Netlify Scheduled Functions trigger (e.g. schedule = "@daily" in functions directory or via Netlify cron plugin)
# Runs /.netlify/functions/reconcile to audit payment discrepancies and retry pending Petpooja orders.

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[redirects]]
  from = "/api/payments/*"
  to = "/.netlify/functions/payments/:splat"
  status = 200

[[redirects]]
  from = "/payments/*"
  to = "/.netlify/functions/payments/:splat"
  status = 200

[[redirects]]
  from = "/api/reconcile"
  to = "/.netlify/functions/reconcile"
  status = 200

[[redirects]]
  from = "/reconcile"
  to = "/.netlify/functions/reconcile"
  status = 200

[[redirects]]
  from = "/api/petpooja/health"
  to = "/.netlify/functions/petpooja-health"
  status = 200

[[redirects]]
  from = "/api/petpooja/webhook"
  to = "/.netlify/functions/petpooja-webhook"
  status = 200

[[redirects]]
  from = "/api/petpooja/queue/*"
  to = "/.netlify/functions/petpooja-queue/:splat"
  status = 200

[[redirects]]
  from = "/api/porter/create"
  to = "/.netlify/functions/create-porter-order"
  status = 200

[[redirects]]
  from = "/api/porter/webhook"
  to = "/.netlify/functions/porter-webhook"
  status = 200

[[redirects]]
  from = "/api/account/*"
  to = "/.netlify/functions/account/:splat"
  status = 200

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

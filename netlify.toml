[build]
  publish = "dist/mobile"
  command = "npm run build"

# Netlify functions removed 2026-09-23: Firebase Cloud Functions v2
# (asia-south1, functions/src) is the sole backend. No functions plugin needed.

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

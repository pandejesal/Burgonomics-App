<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' capacitor://localhost https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://*.razorpay.com https://apis.google.com https://www.google.com https://www.gstatic.com; frame-src 'self' https://checkout.razorpay.com https://*.razorpay.com https://*.firebaseapp.com https://www.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' capacitor://localhost https://*.razorpay.com https://api.razorpay.com https://lumberjack.razorpay.com https://*.firebaseio.com https://*.googleapis.com https://*.cloudfunctions.net https://nominatim.openstreetmap.org wss:;"
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        background: var(--background, var(--boot-canvas, #ffffff));
      }
      html {
        background: var(--background, var(--boot-canvas, #ffffff));
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]),
        html:not([data-theme="light"]) body,
        html:not([data-theme="light"]) #app {
          background: var(--background, var(--boot-canvas, #000000));
        }
      }
    </style>
    <!-- Apply the saved or system appearance before any React paint. Mirrors
         --background / applyThemePreference in src/styles.css and
         src/features/settings/state/settingsStore.ts. -->
    <script>
      (function () {
        var root = document.documentElement;
        var resolved = "light";
        try {
          var raw = window.localStorage.getItem("burg.settings");
          var theme = "system";
          if (raw) {
            var parsed = JSON.parse(raw);
            var state =
              parsed && typeof parsed === "object"
                ? parsed.state && typeof parsed.state === "object"
                  ? parsed.state
                  : parsed
                : null;
            if (
              state &&
              (state.theme === "system" || state.theme === "light" || state.theme === "dark")
            ) {
              theme = state.theme;
            }
          }
          if (theme === "system") {
            resolved =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          } else {
            resolved = theme;
          }
        } catch (error) {
          resolved =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        root.classList.toggle("dark", resolved === "dark");
        root.setAttribute("data-theme", resolved);
        root.style.colorScheme = resolved;
        root.style.setProperty("--boot-canvas", resolved === "dark" ? "#000000" : "#FFFFFF");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", resolved === "dark" ? "#000000" : "#FFFFFF");
      })();
    </script>
    <title>BURGONOMICS — The House of DAMN GOOD BURGERS</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/mobile-entry.tsx"></script>
  </body>
</html>

name: Android Build (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Assemble Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚡ Build Web Bundle & Sync Capacitor Android
        run: |
          npm run build:mobile
          npx cap sync android

      - name: 🔑 Provision CI Release Keystore
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'ci_build_keystore_pass' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'ci_build_keystore_pass' }}
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "Generating CI release signing keystore..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias burgonomics \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$RELEASE_STORE_PASSWORD" \
              -keypass "$RELEASE_KEY_PASSWORD" \
              -dname "CN=Burgonomics, OU=Mobile, O=GlassdoorsStudio, L=Ahmedabad, ST=Gujarat, C=IN"
          fi

      - name: 🔨 Assemble Android Release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: "../release.keystore"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'ci_build_keystore_pass' }}
          RELEASE_KEY_ALIAS: "burgonomics"
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'ci_build_keystore_pass' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burgonomics-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

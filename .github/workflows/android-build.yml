name: Android Build (Capacitor)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  build-android:
    name: Build & Assemble Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22.23.4)
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: "npm"

      - name: ☕ Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install Node Dependencies (frozen lockfile)
        run: npm ci --legacy-peer-deps

      - name: Prepare native production configuration
        run: node scripts/prepare-native-config.mjs android
        env:
          MOBILE_PRODUCTION_ENV: ${{ secrets.MOBILE_PRODUCTION_ENV }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: ⚡ Build Web Bundle & Sync Capacitor Android
        run: |
          npm run build:mobile
          npx cap sync android

      - name: Neutralize Windows-only org.gradle.java.home
        run: sed -i '/^org.gradle.java.home=/d' android/gradle.properties

      - name: "🛡️ Preflight: Validate release secrets non-empty"
        # CI gate: ensure all required release signing secrets are present before
        # attempting decode or Gradle release task. The values arrive through
        # env: so no secret expression is ever substituted into this script —
        # an interpolated value would be expanded before the shell parses it.
        # Only quoted expansions of the variables are read, and error messages
        # name the field alone; no secret value reaches the log.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is empty or missing";
            exit 1;
          fi
          if [ -z "${RELEASE_STORE_PASSWORD:-}" ]; then
            echo "::error::RELEASE_STORE_PASSWORD secret is empty or missing";
            exit 1;
          fi
          if [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::error::RELEASE_KEY_PASSWORD secret is empty or missing";
            exit 1;
          fi
          if [ -z "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "::error::RELEASE_KEY_ALIAS secret is empty or missing";
            exit 1;
          fi

      - name: 🔑 Decode Release Keystore (from secret)
        working-directory: android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        # android/app/build.gradle resolves RELEASE_STORE_FILE via file()
        # relative to android/app/, so "../release.keystore" == android/release.keystore.
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: 🔨 Assemble Android Release APK & AAB Bundle
        working-directory: android
        env:
          RELEASE_STORE_FILE: "../release.keystore"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burgonomics-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: 📤 Upload Release AAB Bundle Artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: burgonomics-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web build, typecheck, lint, unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run lint
      - run: npx tsx scripts/verify-dashboard-unit.ts
      - run: npx vitest run

  functions:
    name: Netlify functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: netlify/functions/package-lock.json
      - run: npm ci
        working-directory: netlify/functions
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: netlify/functions

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: ./gradlew assembleDebug
        working-directory: android

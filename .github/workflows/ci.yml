name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web build, typecheck, lint, unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --mode staging: this is a CI compile check, not a release. A default
      # (`production`) build has no release env here and releaseConfigGuard
      # (vite.config.ts) correctly aborts it. A REAL production build must still
      # fail without live values — that guard is untouched.
      - run: npm run build -- --mode staging
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run lint
      - run: npx tsx scripts/verify-dashboard-unit.ts
      - run: npx vitest run

  rules:
    name: Firestore rules suite (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore --project burgonomics-test-rules "npx vitest run tests/rules --reporter=verbose --hookTimeout=120000 --fileParallelism=false"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # --mode staging: CI compile check only (see the web job's note). The
      # Capacitor shell is built for real by the signed iOS/Android release jobs,
      # which keep the production guard intact.
      - run: npm run build:mobile -- --mode staging
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android

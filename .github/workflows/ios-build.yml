name: Build iOS Application (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Export iOS Package
    runs-on: macos-14
    env:
      GIT_CONFIG_PARAMETERS: "'safe.directory=*'"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Configure Git Safe Directories
        run: |
          git config --global --add safe.directory "*"
          sudo git config --system --add safe.directory "*" || true
          git config --global http.sslVerify false

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚡ Build Web Bundle & Sync Capacitor iOS
        run: |
          npm run build:mobile
          npx cap sync ios
          node -e "const fs = require('fs'); const file = 'ios/App/CapApp-SPM/Package.swift'; if (fs.existsSync(file)) { let c = fs.readFileSync(file, 'utf8').replace(/\\\\/g, '/'); if (!c.includes('keychain-swift')) { c = c.replace('.package(url: \"https://github.com/ionic-team/capacitor-swift-pm.git\", exact: \"8.4.2\"),', '.package(url: \"https://github.com/ionic-team/capacitor-swift-pm.git\", exact: \"8.4.2\"),\n        .package(url: \"https://github.com/evgenyneu/keychain-swift.git\", exact: \"21.0.0\"),'); c = c.replace('.product(name: \"Capacitor\", package: \"capacitor-swift-pm\"),', '.product(name: \"Capacitor\", package: \"capacitor-swift-pm\"),\n                .product(name: \"KeychainSwift\", package: \"keychain-swift\"),'); } fs.writeFileSync(file, c); } const sf = 'node_modules/@aparajita/capacitor-secure-storage/Package.swift'; if (fs.existsSync(sf)) { fs.writeFileSync(sf, fs.readFileSync(sf, 'utf8').replace(/SecureStoragePlugin/g, 'AparajitaCapacitorSecureStorage')); }"

      - name: 🛠️ Setup Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🏗️ Compile iOS Application & Package Build
        run: |
          git config --global --add safe.directory "*"
          sudo git config --system --add safe.directory "*" || true
          cd ios/App

          echo "Resolving Swift Package Dependencies..."
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -resolvePackageDependencies || true

          echo "Compiling iOS Application..."
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination "platform=iOS Simulator,name=iPhone 15" \
                     -skipPackagePluginValidation \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

          echo "Compressing compiled App.app bundle..."
          APP_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData /Users/runner/work -name "App.app" -type d 2>/dev/null | head -n 1)
          echo "Found compiled app at: '$APP_PATH'"
          if [ -n "$APP_PATH" ]; then
            (cd "$(dirname "$APP_PATH")" && zip -r -y "$GITHUB_WORKSPACE/Burgonomics-iOS-Simulator-App.zip" App.app) 2>/dev/null || true
            echo "✅ SUCCESS: Zip archive created successfully at Burgonomics-iOS-Simulator-App.zip"
          fi

      - name: 📤 Upload iOS Application Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Burgonomics-iOS-Simulator-App
          path: Burgonomics-iOS-Simulator-App.zip
          retention-days: 14

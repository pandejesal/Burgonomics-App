# iOS Build (Capacitor) — credential-free simulator CI + unsigned archive scaffold.
#
# A07 readiness upgrade (2026-10-14), Xcode 26 / iOS SDK 26 policy:
#   - Runners: macOS 14 images are deprecated (removal 2026-11-02), so both jobs
#     now use macos-26 (GA since 2026-02-26; default Xcode 26.x with iOS 26 SDKs
#     per actions/runner-images). macos-15 also carries Xcode 26.0.1–26.3 and
#     remains a valid label; the script discovers whichever toolchain qualifies.
#   - No Xcode hardpin: the previous `/Applications/Xcode_15.4.app` selection is
#     REMOVED. scripts/select-xcode-toolchain.sh enumerates every installed
#     Xcode, and FAILS the job unless one candidate meets BOTH floors: Xcode
#     major >= 26 AND iOS SDK major >= 26 (Apple requires both versions), then
#     picks the best compatible pair. Exact installed versions are discovered
#     at run time, never guessed or pinned here.
#   - Safety posture unchanged: no Apple signing, no store upload, no secrets.
#     All xcodebuild invocations keep CODE_SIGNING_ALLOWED=NO; artifacts are
#     unsigned simulator .app / .xcarchive only.
#   - scripts/patch-ios-spm.js still runs after `cap sync ios` in every job that
#     syncs iOS: the SPM graph (capacitor-swift-pm exact 8.5.2 vs
#     @capacitor/push-notifications exact 8.5.0) does not resolve without it.
#     The pin is retained pending a dependency decision — do not delete it.
#   - Static guard (no build/network/CI needed):
#       node --test scripts/validate-ios-workflow.test.cjs
name: iOS Build (Capacitor)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  build-ios:
    name: Build & Export iOS Simulator App
    runs-on: macos-26
    env:
      GIT_CONFIG_PARAMETERS: "'safe.directory=*'"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Discover Xcode toolchain (require iOS SDK >= 26)
        # Fail fast, before the expensive npm/build steps, when the runner has
        # no qualifying toolchain. Discovers the best installed Xcode; never
        # hardpins an exact version.
        run: bash scripts/select-xcode-toolchain.sh
        env:
          MIN_XCODE_MAJOR: "26"
          MIN_IOS_SDK_MAJOR: "26"

      - name: 🛠️ Configure Git Safe Directories
        run: |
          sudo git config --system --add safe.directory "*"
          git config --global --add safe.directory "*"

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare simulator-only compile fixture
        run: node scripts/prepare-simulator-config.mjs
        env:
          CI_SIMULATOR_ONLY: 'true'
      - name: ⚡ Build Web Bundle & Sync Capacitor iOS
        run: |
          npm run build:mobile -- --mode staging
          npx cap sync ios
          node scripts/configure-ios-firebase.mjs

      - name: 🔧 Patch Swift Packages (scripts/patch-ios-spm.js)
        # Order is load-bearing: cap sync regenerates CapApp-SPM/Package.swift
        # with exact 8.5.2; the patch reconciles it with the plugin pins.
        run: node scripts/patch-ios-spm.js

      - name: 🏗️ Build iOS Simulator App
        run: |
          cd ios/App

          echo "Resolving Swift Package Dependencies..."
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -derivedDataPath ../../build/DerivedData \
                     -clonedSourcePackagesDirPath ../../build/DerivedData/SourcePackages \
                     -resolvePackageDependencies

          echo "Compiling iOS Simulator build..."
          set +e
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination "generic/platform=iOS Simulator" \
                     -derivedDataPath ../../build/DerivedData \
                     -clonedSourcePackagesDirPath ../../build/DerivedData/SourcePackages \
                     -skipPackagePluginValidation \
                     IPHONEOS_DEPLOYMENT_TARGET=16.0 \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
                     GCC_TREAT_WARNINGS_AS_ERRORS=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build > xcodebuild.log 2>&1
          XCODE_STATUS=$?
          set -e

          if [ $XCODE_STATUS -ne 0 ]; then
            echo "::error::xcodebuild failed with status $XCODE_STATUS"
            echo "=== XCODEBUILD ERROR LINES ==="
            grep -n -C 3 -i "error:" xcodebuild.log || true
            echo "=== LAST 150 LINES OF XCODEBUILD LOG ==="
            tail -n 150 xcodebuild.log
            exit $XCODE_STATUS
          fi

          echo "✅ Simulator build succeeded"

          APP_PATH=$(find ../../build/DerivedData -name "App.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find /Users/runner/work -name "App.app" -type d 2>/dev/null | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            (cd "$(dirname "$APP_PATH")" && zip -r -y "$GITHUB_WORKSPACE/Burgonomics-iOS-Simulator-App.zip" App.app)
            echo "✅ Simulator app archived at Burgonomics-iOS-Simulator-App.zip"
          else
            echo "::error::App.app bundle not found after compilation"
            exit 1
          fi

      - name: 📤 Upload Build Log on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/App/xcodebuild.log
          retention-days: 7

      - name: 📤 Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Burgonomics-iOS-Simulator-App
          path: Burgonomics-iOS-Simulator-App.zip
          if-no-files-found: error
          retention-days: 14

  ios-archive:
    name: iOS Archive (signed when configured)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Discover Xcode toolchain (require iOS SDK >= 26)
        run: bash scripts/select-xcode-toolchain.sh
        env:
          MIN_XCODE_MAJOR: "26"
          MIN_IOS_SDK_MAJOR: "26"

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔎 Preflight release configuration (skip cleanly when unconfigured)
        id: preflight
        # A review/simulator run has no production secrets, so
        # prepare-native-config.mjs throws "Missing GitHub secret
        # MOBILE_PRODUCTION_ENV" and marks the WHOLE run failed even though the
        # simulator app built. Detect that case up front and skip the archive
        # job with a notice instead.
        #
        # This is NOT a way to ship unsigned: on main/master or any v* release
        # tag the job is a HARD FAILURE, so a real release can never go out
        # unconfigured. Only non-release runs may skip.
        env:
          MOBILE_PRODUCTION_ENV: ${{ secrets.MOBILE_PRODUCTION_ENV }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          is_release="false"
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            is_release="true"
          fi
          case "${{ github.ref }}" in
            refs/tags/v*) is_release="true" ;;
          esac
          if [ "$is_release" = "true" ]; then
            echo "release branch/tag — production secrets are REQUIRED (no skip allowed)"
            node -e "process.exit(0)" # no-op: the real gate is the config step below
          fi
          missing=""
          [ -n "${MOBILE_PRODUCTION_ENV:-}" ] || missing="MOBILE_PRODUCTION_ENV"
          [ -n "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ] || missing="${missing:+$missing, }GOOGLE_SERVICE_INFO_PLIST_BASE64"
          if [ -n "$missing" ] && [ "$is_release" = "false" ]; then
            echo "::notice::Skipping iOS archive: production secrets absent on a non-release run ($missing). The simulator app built successfully; this job is a no-op until the release secrets are configured."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare native production configuration
        if: steps.preflight.outputs.skip != 'true'
        run: node scripts/prepare-native-config.mjs ios
        env:
          MOBILE_PRODUCTION_ENV: ${{ secrets.MOBILE_PRODUCTION_ENV }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: ⚡ Build Web Bundle & Sync Capacitor iOS
        if: steps.preflight.outputs.skip != 'true'
        run: |
          npm run build:mobile
          npx cap sync ios
          node scripts/configure-ios-firebase.mjs

      - name: 🔧 Patch Swift Packages (scripts/patch-ios-spm.js)
        if: steps.preflight.outputs.skip != 'true'
        # Was missing here while present in build-ios: without the patch this
        # job hands Xcode a Package.swift whose exact pins do not intersect
        # (8.5.2 vs 8.5.0) and archive fails at SPM resolution.
        run: node scripts/patch-ios-spm.js

      - name: 🏗️ Archive iOS App (unsigned)
        id: archive
        if: steps.preflight.outputs.skip != 'true'
        run: python3 scripts/archive_ios.py
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}

      - name: 📤 Upload Unsigned iOS Archive
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-unsigned-xcarchive
          path: build/App.xcarchive
          if-no-files-found: error

      - name: Upload signed IPA (never submit automatically)
        if: steps.archive.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-store-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error

  # A successful compile says nothing about whether the app starts. This boots a
  # real simulator and fails if the app is not alive after 45 seconds. It uses the
  # simulator-only Firebase fixture, so it proves launch and rendering, NOT real
  # data, sign-in, payment or push.
  ios-sim-smoke:
    name: iOS Simulator launch smoke
    needs: build-ios
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: Download simulator app
        uses: actions/download-artifact@v4
        with:
          name: Burgonomics-iOS-Simulator-App
          path: sim-app

      - name: Boot a simulator and launch the app
        run: |
          set -euo pipefail
          unzip -q sim-app/Burgonomics-iOS-Simulator-App.zip -d sim-app
          mkdir -p smoke
          UDID=$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if "iPhone" in device["name"]:
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("no available iPhone simulator")
          PY
          )
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" sim-app/App.app
          xcrun simctl launch "$UDID" com.burgonomics | tee smoke/launch.txt
          sleep 30
          xcrun simctl io "$UDID" screenshot smoke/after-30s.png
          sleep 15
          xcrun simctl io "$UDID" screenshot smoke/after-45s.png
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -i "com.burgonomics" > smoke/process.txt; then
            echo "::error::The app is not running 45 seconds after launch"
            exit 1
          fi

      - name: Collect logs and any crash report
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "App"' 2>/dev/null | tail -n 400 > smoke/app-log.txt || true
          find "$HOME/Library/Logs/DiagnosticReports" -type f -name 'App*' -mmin -10 -exec cp {} smoke/ \; 2>/dev/null || true

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-smoke
          path: smoke
          if-no-files-found: warn
          retention-days: 14

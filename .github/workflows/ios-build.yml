name: Build iOS Application (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Export iOS Package
    runs-on: macos-15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚡ Build Web Bundle & Sync Capacitor iOS
        run: |
          npm run build:mobile
          npx cap sync ios

      - name: 🛠️ Setup Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🍏 Install CocoaPods (if podfile exists)
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install || pod install --repo-update
            cd ../..
          fi

      - name: 🏗️ Compile iOS Application & Package Build
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -resolvePackageDependencies
            PROJ_ARG="-workspace App.xcworkspace"
          else
            xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies
            PROJ_ARG="-project App.xcodeproj"
          fi

          xcodebuild $PROJ_ARG \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ../../build/DerivedData \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
                     clean build

          mkdir -p ../../build/Payload
          cp -r ../../build/DerivedData/Build/Products/Release-iphoneos/App.app ../../build/Payload/
          cd ../../build
          zip -r Burgonomics-iOS-App.ipa Payload
          echo "✅ SUCCESS: Unsigned iOS application package created successfully at build/Burgonomics-iOS-App.ipa"

      - name: 📤 Upload iOS Application Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Burgonomics-iOS-Package
          path: |
            build/Burgonomics-iOS-App.ipa
            build/DerivedData/Build/Products/Release-iphoneos/App.app
          retention-days: 14

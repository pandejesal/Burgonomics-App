name: iOS Build (Capacitor)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Export iOS Simulator App
    runs-on: macos-14
    env:
      GIT_CONFIG_PARAMETERS: "'safe.directory=*'"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Configure Git Safe Directories
        run: |
          sudo git config --system --add safe.directory "*"
          git config --global --add safe.directory "*"

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚡ Build Web Bundle & Sync Capacitor iOS
        run: |
          npm run build:mobile
          npx cap sync ios

      - name: 🛠️ Setup Xcode Version
        run: |
          if ls -d /Applications/Xcode_16*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | head -n 1)/Contents/Developer"
          elif ls -d /Applications/Xcode_15*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_15*.app | head -n 1)/Contents/Developer"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🔧 Patch Swift Packages (keychain-swift & secure-storage)
        run: |
          node -e "
            const fs = require('fs');
            const file = 'ios/App/CapApp-SPM/Package.swift';
            if (fs.existsSync(file)) {
              let c = fs.readFileSync(file, 'utf8').replace(/\\\\/g, '/');
              if (!c.includes('keychain-swift')) {
                c = c.replace(/(\.package\(url:\s*\"https:\/\/github\.com\/ionic-team\/capacitor-swift-pm\.git\",[^\)]+\),)/, '\$1\n        .package(url: \"https://github.com/evgenyneu/keychain-swift.git\", exact: \"21.0.0\"),');
                c = c.replace('.product(name: \"Capacitor\", package: \"capacitor-swift-pm\"),', '.product(name: \"Capacitor\", package: \"capacitor-swift-pm\"),\n                .product(name: \"KeychainSwift\", package: \"keychain-swift\"),');
              }
              fs.writeFileSync(file, c);
              if (!c.includes('KeychainSwift')) {
                console.error('Failed to inject KeychainSwift dependency into CapApp-SPM/Package.swift');
                process.exit(1);
              }
            }
            const sf = 'node_modules/@aparajita/capacitor-secure-storage/Package.swift';
            if (fs.existsSync(sf)) {
              fs.writeFileSync(sf, fs.readFileSync(sf, 'utf8').replace(/SecureStoragePlugin/g, 'AparajitaCapacitorSecureStorage'));
            }
          "

      - name: 🏗️ Build iOS Simulator App
        run: |
          cd ios/App

          echo "Resolving Swift Package Dependencies..."
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -derivedDataPath ../../build/DerivedData \
                     -clonedSourcePackagesDirPath ../../build/DerivedData/SourcePackages \
                     -resolvePackageDependencies

          echo "Compiling iOS Simulator build..."
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination "generic/platform=iOS Simulator" \
                     -derivedDataPath ../../build/DerivedData \
                     -clonedSourcePackagesDirPath ../../build/DerivedData/SourcePackages \
                     -skipPackagePluginValidation \
                     IPHONEOS_DEPLOYMENT_TARGET=16.0 \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
                     GCC_TREAT_WARNINGS_AS_ERRORS=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build

          echo "✅ Simulator build succeeded"

          APP_PATH=$(find ../../build/DerivedData -name "App.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find /Users/runner/work -name "App.app" -type d 2>/dev/null | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            (cd "$(dirname "$APP_PATH")" && zip -r -y "$GITHUB_WORKSPACE/Burgonomics-iOS-Simulator-App.zip" App.app)
            echo "✅ Simulator app archived at Burgonomics-iOS-Simulator-App.zip"
          else
            echo "::error::App.app bundle not found after compilation"
            exit 1
          fi

      - name: 📤 Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: Burgonomics-iOS-Simulator-App
          path: Burgonomics-iOS-Simulator-App.zip
          if-no-files-found: error
          retention-days: 14

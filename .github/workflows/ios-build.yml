name: iOS Build (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Export iOS Package
    runs-on: macos-14
    env:
      GIT_CONFIG_PARAMETERS: "'safe.directory=*'"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Configure Git Safe Directories
        run: |
          sudo git config --system --add safe.directory "*"
          git config --global --add safe.directory "*"

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚡ Build Web Bundle & Sync Capacitor iOS
        run: |
          npm run build:mobile
          npx cap sync ios

      - name: 🛠️ Setup Xcode Version
        run: |
          if ls -d /Applications/Xcode_16*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | head -n 1)/Contents/Developer"
          elif ls -d /Applications/Xcode_15*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_15*.app | head -n 1)/Contents/Developer"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🔧 Patch Swift Packages (keychain-swift)
        run: |
          node -e "
            const fs = require('fs');
            const file = 'ios/App/CapApp-SPM/Package.swift';
            if (fs.existsSync(file)) {
              let c = fs.readFileSync(file, 'utf8').replace(/\\\\/g, '/');
              if (!c.includes('keychain-swift')) {
                c = c.replace(/(\.package\(url:\s*\"https:\/\/github\.com\/ionic-team\/capacitor-swift-pm\.git\",[^\)]+\),)/, '\$1\n        .package(url: \"https://github.com/evgenyneu/keychain-swift.git\", exact: \"21.0.0\"),');
                c = c.replace('.product(name: \"Capacitor\", package: \"capacitor-swift-pm\"),', '.product(name: \"Capacitor\", package: \"capacitor-swift-pm\"),\n                .product(name: \"KeychainSwift\", package: \"keychain-swift\"),');
              }
              fs.writeFileSync(file, c);
              if (!c.includes('KeychainSwift')) {
                console.error('Failed to inject KeychainSwift dependency into CapApp-SPM/Package.swift');
                process.exit(1);
              }
            }
            const sf = 'node_modules/@aparajita/capacitor-secure-storage/Package.swift';
            if (fs.existsSync(sf)) {
              fs.writeFileSync(sf, fs.readFileSync(sf, 'utf8').replace(/SecureStoragePlugin/g, 'AparajitaCapacitorSecureStorage'));
            }
          "

      - name: 🏗️ Build iOS Simulator App
        run: |
          cd ios/App

          echo "Resolving Swift Package Dependencies..."
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -derivedDataPath ../../build/DerivedData \
                     -clonedSourcePackagesDirPath ../../build/DerivedData/SourcePackages \
                     -resolvePackageDependencies

          echo "Compiling iOS Simulator build..."
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination "generic/platform=iOS Simulator" \
                     -derivedDataPath ../../build/DerivedData \
                     -clonedSourcePackagesDirPath ../../build/DerivedData/SourcePackages \
                     -skipPackagePluginValidation \
                     IPHONEOS_DEPLOYMENT_TARGET=16.0 \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
                     GCC_TREAT_WARNINGS_AS_ERRORS=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build

          echo "✅ Simulator build succeeded"

          APP_PATH=$(find /Users/runner/work -name "App.app" -type d 2>/dev/null | head -n 1)
          if [ -n "$APP_PATH" ]; then
            (cd "$(dirname "$APP_PATH")" && zip -r -y "$GITHUB_WORKSPACE/Burgonomics-iOS-Simulator-App.zip" App.app) 2>/dev/null || true
            echo "✅ Simulator app archived at Burgonomics-iOS-Simulator-App.zip"
          fi

      - name: 🏗️ Build iOS Device IPA (requires signing secrets)
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
        run: |
          if [ -z "$IOS_CERTIFICATE_BASE64" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_UUID" ]; then
            echo "::error::Partial iOS signing secrets detected. All 4 secrets (IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, IOS_PROVISIONING_PROFILE_UUID) must be configured."
            exit 1
          fi

          cd ios/App

          echo "🔑 Installing signing certificate..."
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "" build.keychain || true
          security import /tmp/certificate.p12 -t agg -k /tmp/build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -A
          security list-keychains -s /tmp/build.keychain
          security unlock-keychain -p "" /tmp/build.keychain
          security set-keychain-settings -t 3600 -u /tmp/build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s kSecUseServiceUI -k "" /tmp/build.keychain

          echo "📥 Installing provisioning profile..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/$IOS_PROVISIONING_PROFILE_UUID.mobileprovision

          echo "🔨 Building for generic iOS device..."
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     -derivedDataPath ../../build/DerivedData \
                     -clonedSourcePackagesDirPath ../../build/DerivedData/SourcePackages \
                     -skipPackagePluginValidation \
                     PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_UUID" \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     CODE_SIGNING_REQUIRED=YES \
                     CODE_SIGNING_ALLOWED=YES \
                     IPHONEOS_DEPLOYMENT_TARGET=16.0 \
                     SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
                     GCC_TREAT_WARNINGS_AS_ERRORS=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     archive \
                     -archivePath ../../build/DerivedData/App.xcarchive > xcodebuild-device.log 2>&1
          DEV_EXIT=$?
          set -e

          if [ $DEV_EXIT -ne 0 ]; then
            echo "❌ Device build failed with exit code $DEV_EXIT"
            grep -i "error:" xcodebuild-device.log | head -n 20 | while read -r line; do echo "::error::$line"; done
            tail -n 100 xcodebuild-device.log
          else
            echo "✅ Device build succeeded"
          fi

          APP_PATH=$(find /Users/runner/work -name "App.app" -type d 2>/dev/null | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "📦 Exporting IPA..."
            xcodebuild -exportArchive \
                       -archivePath /Users/runner/work/${{ github.repository }}/build/DerivedData/App.xcarchive \
                       -exportPath /Users/runner/work/${{ github.repository }}/build/ipa \
                       -exportOptionsPlist /dev/stdin <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>app-store</string>
    <key>provisioningProfiles</key>
    <dict>
        <key>com.glassdoorsstudio.burgonomics</key>
        <string>$IOS_PROVISIONING_PROFILE_UUID</string>
    </dict>
    <key>signingStyle</key>
    <string>manual</string>
    <key>teamID</key>
    <string>${{ secrets.IOS_TEAM_ID }}</string>
</dict>
</plist>
EOF
            if [ -f /Users/runner/work/${{ github.repository }}/build/ipa/App.ipa ]; then
              mv /Users/runner/work/${{ github.repository }}/build/ipa/App.ipa "$GITHUB_WORKSPACE/Burgonomics-iOS-Device.ipa"
              echo "✅ IPA exported at Burgonomics-iOS-Device.ipa"
            else
              echo "⚠️ IPA export failed or no IPA found"
            fi
          fi

      - name: 📤 Upload Xcode Build Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xcode-Build-Logs
          path: |
            ios/App/xcodebuild.log
            ios/App/xcodebuild-device.log
          retention-days: 7

      - name: 📤 Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Burgonomics-iOS-Simulator-App
          path: Burgonomics-iOS-Simulator-App.zip
          retention-days: 14

      - name: 📤 Upload iOS Device IPA
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Burgonomics-iOS-Device-IPA
          path: Burgonomics-iOS-Device.ipa
          retention-days: 14

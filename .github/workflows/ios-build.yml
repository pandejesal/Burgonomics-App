# iOS Build (Capacitor) - simulator-only CI.
#
# A07 readiness upgrade (2026-10-14), Xcode 26 / iOS SDK 26 policy:
#   - Runners: macOS 14 images are deprecated (removal 2026-11-02), so this job
#     uses macos-26 (GA since 2026-02-26; default Xcode 26.x with iOS 26 SDKs
#     per actions/runner-images). macos-15 also carries Xcode 26.0.1-26.3 and
#     remains a valid label; the script discovers whichever toolchain qualifies.
#   - No Xcode hardpin: the previous `/Applications/Xcode_15.4.app` selection is
#     REMOVED. scripts/select-xcode-toolchain.sh enumerates every installed
#     Xcode, and FAILS the job unless one candidate meets BOTH floors: Xcode
#     major >= 26 AND iOS SDK major >= 26 (Apple requires both versions), then
#     picks the best compatible pair. Exact installed versions are discovered
#     at run time, never guessed or pinned here.
#   - SIMULATOR-ONLY. This file has no archive job, no signing secrets and no
#     key-bearing global env. Signed IPA creation lives in the separately gated
#     ios-distribution.yml. All xcodebuild invocations keep
#     CODE_SIGNING_ALLOWED=NO; artifacts are unsigned simulator app bundles.
#   - scripts/patch-ios-spm.js still runs after `cap sync ios`, but it no longer
#     re-pins anything: `cap sync` generates the app aggregator pin as an exact
#     match for the installed @capacitor/ios, and the patch validates the app and
#     plugin constraints against that version, failing closed on a conflict. The
#     historical Swift compatibility patch bodies (KVC/typed-getter fixes) remain
#     in place and their native compile/runtime behaviour is still unverified.
#     NOTE: this is a source-level expectation. SPM resolution is NOT verified on
#     this Windows host; that remains unproven until a macOS runner executes it.
#   - Static guard (no build/network/CI needed):
#       node --test scripts/validate-ios-workflow.test.cjs
#   - Deterministic install policy (2026-11-08): the exact Node patch '22.23.4'
#     (verified security release, bundled npm 10.9.9) is pinned, and installs use
#     `npm ci --ignore-scripts --legacy-peer-deps`. npm ci installs
#     package-lock.json as written and fails when it disagrees with package.json;
#     it never edits the lock. npm install may reconcile and rewrite the lock, so
#     one commit can produce different trees on different days.
#     --legacy-peer-deps stays because npm 10 still needs it to shape this repo's
#     peer graph; .npmrc sets the same key, so the explicit flag keeps runners
#     that ignore .npmrc on the identical tree. --ignore-scripts blocks every
#     package lifecycle hook in CI. Each install step's whole run block must be
#     that one command: a wrapper that skips or masks it is not a frozen install.
#     Bump the pin and this guard together.
name: iOS Build (Capacitor)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      real_staging:
        description: Use real staging Firebase/API configuration for the client demo (no live payments)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS Simulator build (simulator-only)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI_SIMULATOR_ONLY: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Discover Xcode toolchain (require iOS SDK >= 26)
        # Fail fast, before the expensive npm/build steps, when the runner has
        # no qualifying toolchain. Discovers the best installed Xcode; never
        # hardpins an exact version.
        run: bash scripts/select-xcode-toolchain.sh
        env:
          MIN_XCODE_MAJOR: "26"
          MIN_IOS_SDK_MAJOR: "26"

      - name: Setup Node.js (v22.23.4)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          cache: "npm"

      - name: Install Node Dependencies (frozen lockfile)
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Prepare simulator-only compile fixture
        if: github.event_name != 'workflow_dispatch' || inputs.real_staging != true
        run: node scripts/prepare-simulator-config.mjs
        env:
          CI_SIMULATOR_ONLY: 'true'

      - name: Prepare real staging simulator configuration
        if: github.event_name == 'workflow_dispatch' && inputs.real_staging == true
        run: node scripts/prepare-demo-simulator.mjs
        env:
          CI_SIMULATOR_ONLY: 'true'
          MOBILE_STAGING_ENV: ${{ secrets.MOBILE_STAGING_ENV }}
          STAGING_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.STAGING_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Build Web Bundle and Sync Capacitor iOS
        run: |
          npm run build:mobile -- --mode staging
          npx cap sync ios
          node scripts/configure-ios-firebase.mjs

      - name: Patch Swift Packages (scripts/patch-ios-spm.js)
        # Order is load-bearing: cap sync regenerates CapApp-SPM/Package.swift
        # and the patch reconciles it with the plugin pins.
        run: node scripts/patch-ios-spm.js

      - name: Build iOS Simulator App
        run: |
          cd ios/App

          echo "Resolving Swift Package Dependencies..."
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -derivedDataPath ../../build/DerivedData \
                     -clonedSourcePackagesDirPath ../../build/DerivedData/SourcePackages \
                     -resolvePackageDependencies

          echo "Compiling iOS Simulator build..."
          set +e
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination "generic/platform=iOS Simulator" \
                     -derivedDataPath ../../build/DerivedData \
                     -clonedSourcePackagesDirPath ../../build/DerivedData/SourcePackages \
                     -skipPackagePluginValidation \
                     IPHONEOS_DEPLOYMENT_TARGET=16.0 \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
                     GCC_TREAT_WARNINGS_AS_ERRORS=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build > xcodebuild.log 2>&1
          XCODE_STATUS=$?
          set -e

          if [ $XCODE_STATUS -ne 0 ]; then
            echo "::error::xcodebuild failed with status $XCODE_STATUS"
            echo "=== XCODEBUILD ERROR LINES ==="
            grep -n -C 3 -i "error:" xcodebuild.log || true
            echo "=== LAST 150 LINES OF XCODEBUILD LOG ==="
            tail -n 150 xcodebuild.log
            exit $XCODE_STATUS
          fi

          echo "Simulator build succeeded"

          APP_PATH=$(find ../../build/DerivedData -name "App.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find /Users/runner/work -name "App.app" -type d 2>/dev/null | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            (cd "$(dirname "$APP_PATH")" && zip -r -y "$GITHUB_WORKSPACE/Burgonomics-iOS-Simulator-App.zip" App.app)
            echo "Simulator app archived at Burgonomics-iOS-Simulator-App.zip"
          else
            echo "::error::App.app bundle not found after compilation"
            exit 1
          fi

      - name: Upload Build Log on Failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/App/xcodebuild.log
          retention-days: 7

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: Burgonomics-iOS-Simulator-App
          path: Burgonomics-iOS-Simulator-App.zip
          if-no-files-found: error
          retention-days: 14

  # A successful compile says nothing about whether the app starts. This boots a
  # real simulator and fails if the app is not alive after 45 seconds. A manual
  # real_staging run uses genuine staging config; the default fixture lane proves
  # launch/rendering only. Neither lane proves payment, push or physical iPhone QA.
  ios-sim-smoke:
    name: iOS Simulator launch smoke
    needs: build-ios
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI_SIMULATOR_ONLY: 'true'
    steps:
      - name: Download simulator app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Burgonomics-iOS-Simulator-App
          path: sim-app

      - name: Boot a simulator and launch the app
        run: |
          set -euo pipefail
          unzip -q sim-app/Burgonomics-iOS-Simulator-App.zip -d sim-app
          mkdir -p smoke
          UDID=$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if "iPhone" in device["name"]:
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("no available iPhone simulator")
          PY
          )
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" sim-app/App.app
          # The store picker waits on GPS: a fresh simulator has no position, so
          # grant location and place it in Ahmedabad, where the DEMO outlet is.
          xcrun simctl privacy "$UDID" grant location com.burgonomics || true
          xcrun simctl location "$UDID" set 23.0225,72.5714 || true
          xcrun simctl launch "$UDID" com.burgonomics | tee smoke/launch.txt
          sleep 30
          xcrun simctl io "$UDID" screenshot smoke/after-30s.png
          sleep 15
          xcrun simctl io "$UDID" screenshot smoke/after-45s.png
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -i "com.burgonomics" > smoke/process.txt; then
            echo "::error::The app is not running 45 seconds after launch"
            exit 1
          fi
          printf 'real_staging=%s\npush=not-tested\nsigning=none\n' "$REAL_STAGING" > smoke/scope.txt
        env:
          REAL_STAGING: ${{ inputs.real_staging }}

      - name: Collect logs and any crash report
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "App"' 2>/dev/null | tail -n 400 | sed -E 's/A[A-Za-z0-9_-]{38}/[REDACTED_API_KEY]/g; s/rzp_(test|live)_[A-Za-z0-9_]+/[REDACTED_PAYMENT_KEY]/g' > smoke/app-log.txt || true
          find "$HOME/Library/Logs/DiagnosticReports" -type f -name 'App*' -mmin -10 -exec cp {} smoke/ \; 2>/dev/null || true

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-sim-smoke
          path: smoke
          if-no-files-found: warn
          retention-days: 14

name: Build iOS Application (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Export iOS Package
    runs-on: macos-15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Configure Git Safe Directories
        run: |
          git config --global --add safe.directory "*"
          git config --global http.sslVerify false

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚡ Build Web Bundle & Sync Capacitor iOS
        run: |
          npm run build:mobile
          npx cap sync ios
          node -e "const fs = require('fs'); const file = 'ios/App/CapApp-SPM/Package.swift'; if (fs.existsSync(file)) { fs.writeFileSync(file, fs.readFileSync(file, 'utf8').replace(/\\\\/g, '/')); }"

      - name: 🛠️ Setup Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🍏 Install CocoaPods (if podfile exists)
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install || pod install --repo-update
            cd ../..
          fi

      - name: 🏗️ Compile iOS Application & Package Build
        run: |
          git config --global --add safe.directory "*"
          cd ios/App

          if [ -d "App.xcworkspace" ]; then
            PROJ_ARG="-workspace App.xcworkspace"
          else
            PROJ_ARG="-project App.xcodeproj"
          fi

          echo "Compiling iOS Application..."
          xcodebuild $PROJ_ARG \
                     -scheme App \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath ../../build/DerivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build

          mkdir -p ../../build/Payload
          cp -r ../../build/DerivedData/Build/Products/Release-iphonesimulator/App.app ../../build/Payload/ 2>/dev/null || true

          cd ../../build
          zip -r Burgonomics-iOS-App.ipa Payload || true
          zip -r Burgonomics-iOS-Simulator-App.zip DerivedData/Build/Products/Release-iphonesimulator/App.app || true
          echo "✅ SUCCESS: iOS application packages created successfully!"

      - name: 📤 Upload iOS Application Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Burgonomics-iOS-Package
          path: |
            build/Burgonomics-iOS-App.ipa
            build/Burgonomics-iOS-Simulator-App.zip
            build/DerivedData/Build/Products/Release-iphonesimulator/App.app
          retention-days: 14

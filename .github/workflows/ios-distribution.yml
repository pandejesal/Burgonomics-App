name: iOS Distribution (approved releases only)

# Separate, manually gated iOS signing/archive workflow for the customer app.
#
# WHY SEPARATE: the dedicated simulator workflow must stay structurally
# simulator-only (no archive job, no signing material, no key-bearing env). The
# signed path lives here and nowhere else in this repository.
#
# GATE (all conjuncts must hold; proven by the truth table in
# scripts/validate-ios-workflow.test.cjs):
#   1. event is workflow_dispatch AND the boolean approve_distribution is true
#   2. the default-off repository VARIABLE IOS_DISTRIBUTION_ENABLED is exactly 'true'
#   3. the ref is refs/heads/<default branch> — no tags, no PRs, no other branches
#   4. the job targets the named environment `ios-distribution`
#
# `environment: ios-distribution` here does NOT establish reviewers: this
# repository currently reports NO configured environments. Protection must be
# granted separately before this is a real approval boundary.
#
# FAIL-CLOSED: missing production/signing configuration HARD FAILS the job.
# There is deliberately no "skip cleanly" path, unlike the simulator workflow.
# This workflow creates a CI artifact only. It does not upload to, submit to, or
# publish anything with the App Store.

on:
  workflow_dispatch:
    inputs:
      approve_distribution:
        description: 'Create a signed iOS IPA artifact (requires IOS_DISTRIBUTION_ENABLED=true)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  distribute-ios:
    name: Signed iOS archive (approved)
    runs-on: macos-26
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.approve_distribution == true &&
      vars.IOS_DISTRIBUTION_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: ios-distribution
    steps:
      # FIRST step, before checkout/install/native: a strict, no-secrets approval
      # check. GitHub's `==` is loose and case-insensitive, so the YAML `if:` above
      # alone would accept a branch differing only in case, and vars 'TRUE'. This
      # block compares exact values with Python semantics. No signing keys here.
      - name: Verify approval, ref and enablement
        run: |
          python3 - <<'PY'
          import json, os, sys
          problems = []

          raw_input = os.environ.get('APPROVE_INPUT_JSON', '')
          try:
              approved = json.loads(raw_input)
          except (ValueError, TypeError):
              approved = None
          if approved is not True:
              problems.append('approve_distribution is not boolean true')

          if os.environ.get('ENABLED_VAR', '') != 'true':
              problems.append('IOS_DISTRIBUTION_ENABLED is not exactly "true"')

          actual = os.environ.get('ACTUAL_REF', '')
          expected = os.environ.get('EXPECTED_REF', '')
          if not actual or not expected or actual != expected:
              problems.append('ref is not exactly the default branch')

          if problems:
              print('::error::iOS distribution refused: %s' % '; '.join(problems))
              sys.exit(1)
          print('Approval preflight passed')
          PY
        env:
          # toJSON keeps the boolean's type; the env context is a string, so
          # json.loads is what distinguishes true from "true"/1.
          APPROVE_INPUT_JSON: ${{ toJSON(inputs.approve_distribution) }}
          ENABLED_VAR: ${{ vars.IOS_DISTRIBUTION_ENABLED }}
          ACTUAL_REF: ${{ github.ref }}
          EXPECTED_REF: ${{ format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Discover Xcode toolchain (require iOS SDK >= 26)
        run: bash scripts/select-xcode-toolchain.sh
        env:
          MIN_XCODE_MAJOR: "26"
          MIN_IOS_SDK_MAJOR: "26"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          cache: "npm"

      - run: npm ci --ignore-scripts --legacy-peer-deps

      # Hard failure, not a skip: an unconfigured release run must never look
      # like a successful archive.
      - name: Require production configuration
        run: |
          set -euo pipefail
          missing=""
          [ -n "${MOBILE_PRODUCTION_ENV:-}" ] || missing="MOBILE_PRODUCTION_ENV"
          [ -n "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ] || missing="${missing:+$missing, }GOOGLE_SERVICE_INFO_PLIST_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::iOS distribution configuration is incomplete ($missing). This job fails closed."
            exit 1
          fi
        env:
          MOBILE_PRODUCTION_ENV: ${{ secrets.MOBILE_PRODUCTION_ENV }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Require signing material
        # Portable Python check, no eval. Every KEY is read from a step-scoped
        # env mapping (never global/job scope). Only names are emitted.
        run: |
          python3 - <<'PY'
          import os, sys
          keys = [
              'ASC_API_KEY_BASE64', 'ASC_KEY_ID', 'ASC_ISSUER_ID', 'APPLE_TEAM_ID',
              'IOS_CERTIFICATE_BASE64', 'IOS_CERTIFICATE_PASSWORD', 'IOS_PROFILE_BASE64',
          ]
          missing = [name for name in keys if not os.environ.get(name)]
          if missing:
              print('::error::iOS signing material is incomplete (%s). This job fails closed.'
                    % ', '.join(missing))
              sys.exit(1)
          print('iOS signing material present (%d keys)' % len(keys))
          PY
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}

      - name: Prepare native production configuration
        run: node scripts/prepare-native-config.mjs ios
        env:
          MOBILE_PRODUCTION_ENV: ${{ secrets.MOBILE_PRODUCTION_ENV }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - run: npm run build:mobile
      - run: npx cap sync ios
      - run: node scripts/configure-ios-firebase.mjs
      # Order is load-bearing: cap sync regenerates CapApp-SPM/Package.swift with
      # an exact pin matching the installed @capacitor/ios. The patch validates
      # the app and plugin constraints against that version without re-pinning
      # plugins, and fails closed on a conflict. Its historical Swift
      # compatibility patch bodies remain; native compile/runtime unverified.
      - name: Patch Swift Packages (scripts/patch-ios-spm.js)
        run: node scripts/patch-ios-spm.js

      - name: Archive and export signed IPA
        run: python3 scripts/archive_ios.py
        env:
          # The exact consent token is supplied ONLY here, on the archive step,
          # and only after every gate above has passed.
          IOS_DISTRIBUTION_OPT_IN: 'true'
          MOBILE_PRODUCTION_ENV: ${{ secrets.MOBILE_PRODUCTION_ENV }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          # Accurate: a CI artifact holding the exported IPA. No store submission.
          name: customer-signed-ios-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
